# Public checkpoints for the real-world detection set (direction A, weeks 2-3).
#
# Every repo and base below resolved on the Hub on 2026-11-10 (verified: true means "exists",
# not "weights inspected"). Re-run `uv run python scripts/verify_registry.py` after editing.
# Still to do: grow this to 20-50 abliterated models plus matched benign fine-tunes;
# Hurtado (arXiv 2607.01854) lists 273 checkpoints to mine.
#
# label:
#   abliterated            pure refusal-direction edit of `base` (weight diff should be ~rank 1/matrix)
#   abliterated+finetune   abliterated and then trained further (harder detection case)
#   benign_finetune        ordinary fine-tune of `base` (negative control for detectors)
#   other_edit             a low-rank weight edit of `base` that does not target refusal. Neither a
#                          positive nor a benign fine-tune: it tests whether the weight detector
#                          recognises abliteration or any surgical edit
#   unlearned              an unlearning method applied to `base` (direction D; scored with WMDP)
#   base                   the clean reference itself, or an unmodified mirror of it (null control)
#
# What counts as benign: a fine-tune whose card describes an ordinary task and does not mention
# removing refusals, jailbreaking or ablation. Left out on purpose after reading the cards:
#   XiaoyuWen/TRACE-Mix-Qwen2.5-3B-Instruct   jailbreak attacker model
#   reaperdoesntknow/DeepReasoning_1R         broken upload: every tensor is NaN
#   danielkty22/TARS-SFT-1.5B                 safety-reasoning SFT; refusal data unclear
#   KelvinAxhcar/BitCache-Qwen2.5-0.5B-Instruct   not a fine-tune
#   MadeAgents/Hammer2.0-1.5b, -3b            different base (Coder) / mislabelled size
#   Green-Eye/Llama-3.2-1B-Instruct-heretic   byte-identical copy of the saidutta69 upload
#   rasyosef/Llama-3.2-1B-Amharic             16k added tokens, built on the non-instruct model
#   yingfanbot/gsm-lotus-llama3b              looped-transformer checkpoint, not run as a plain LM
#   FreedomIntelligence/medical_o1_verifier_3B   classification head
#
# Policy: download for analysis only. Do not re-upload, merge or redistribute these weights.

